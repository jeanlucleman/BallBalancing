  <TR>
    <TD >
    <TD class="w3-left">
      <input class='w3-button w3-border w3-light-grey' id='save_changes' type='submit' onclick="updateConfHardware();"  value='Save changes'>
    </TD>



</table>
<script>
// Cette fonction est activée par l'event click sur le bouton Save change du formulaire Config
function updateConfHardware(){
  alert("Entrée dans updateConfHardware!");
	var pinXp = document.getElementById("idPinXp").value;
	var pinXm = document.getElementById("idPinXm").value;
  var pinYp = document.getElementById("idPinYp").value;
  var pinYm = document.getElementById("idPinYm").value;
  var pinServoX = document.getElementById("idPinServoX").value;
  var pinServoY = document.getElementById("idPinServoY").value;
  
	var xhttp = new XMLHttpRequest();
	xhttp.open("POST", "updateConfHardware", true);
  var params = "pinXp=" + pinXp 
  + "&pinXm=" + pinXm 
  + "&pinYp=" + pinYp 
  + "&pinYm=" + pinYm 
  + "&pinServoX=" + pinServoX
  + "&pinServoY=" + pinServoY
  ;
  alert(params);
 	//Send the proper header information along with the request
	xhttp.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
	xhttp.setRequestHeader("Content-length", params.length);
	xhttp.setRequestHeader("Connection", "close");
	xhttp.onreadystatechange = function() {//Call a function when the state changes.
		if(xhttp.readyState == 4 && xhttp.status == 200) {
			alert(xhttp.responseText);
		}
	}
	xhttp.send(params);
}
</script>
